name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build zip python3

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: 构建模块
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ABIS: arm64-v8a armeabi-v7a
        run: |
          chmod +x build.sh
          ./build.sh "$ANDROID_NDK_HOME"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiMate80ProSpoof-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
