name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "python3: $(python3 --version 2>&1)"
          echo "cmake:   $(cmake --version 2>&1 | head -n1)"
          echo "ninja:   $(ninja --version 2>&1)"
          echo "zip:     $(zip --version 2>&1 | head -n2 | tail -n1)"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build zip python3

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ABIS: arm64-v8a armeabi-v7a
        run: |
          chmod +x build.sh
          bash -x ./build.sh "$ANDROID_NDK_HOME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiMate80ProSpoof-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
