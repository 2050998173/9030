# ---- SELinux / 调试 ----
# 注意: ro.debuggable / ro.secure / ro.build.tags 会实际影响系统与 App 行为,
# 个别 App 或框架组件可能因此出现异常。若出现怪问题, 先注释掉这一小段测试。
ro.debuggable=0
ro.secure=1
ro.adb.secure=1
ro.build.selinux=1
ro.boot.selinux=enforcing
ro.build.selinux.checks=1
# 下面两项默认留空 = 不伪装。Magisk 环境里 ro.boot.verifiedbootstate 可能是 orange,
# 上面已经强制成 green; 如果"设置-关于手机"出现异常提示, 把上面
# ro.boot.verifiedbootstate / ro.boot.flash.locked 两行删掉再试。
# 不伪装 USB 相关属性(改了会影响 USB 连接行为)。

