# 注意 about SDK: ro.build.version.sdk 决定 Java 层 Build.VERSION.SDK_INT。
# 我们的 hook 会同时作用于原生层和 Java 层, 所以应用读到的 SDK_INT 与
# 它读 ro.build.version.release 得到的结果是一致的, 不会自相矛盾。
# 但如果你把 sdk 改成一个比真机低很多的值, 应用会走低版本兼容分支,
# 可能出现界面/功能异常 —— 那就把下面这一行删掉(保持真机值)。
