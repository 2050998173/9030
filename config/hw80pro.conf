# ============================================================================
#  HUAWEI Mate 80 Pro 伪装模块 配置文件
#  路径: /data/adb/hw80pro/hw80pro.conf
#
#  语法:
#     key=value       新增/覆盖一条属性
#     cpuinfo=...     /proc/cpuinfo 的伪装内容(见下)
#     以 # 开头         注释
#     行尾 \            续行
#     空 value         表示"保持原值/不伪装"
#
#  修改后需要重启目标应用(或重启手机)才生效。
#  想恢复某项为系统真实值: 把该行删掉或把 value 清空。
# ============================================================================

# ---------------------------------------------------------------------------
# 一、作用范围
# ---------------------------------------------------------------------------
# 只有列在这里的应用会被伪装, 其它应用完全不受影响。
# 支持 `包名:进程名` 精确匹配, 例如 com.tencent.tmgp.dfm:game
# 空值表示"不启用任何应用"(仍然可以在这里临时关闭伪装)。
apps=com.liuzh.deviceinfo
apps=com.maple.detect
apps=com.tencent.tmgp.dfm

# ---------------------------------------------------------------------------
# 二、/proc/cpuinfo 伪装
# ---------------------------------------------------------------------------
#   cpuinfo=@file    使用 /data/adb/hw80pro/proc_cpuinfo.txt (默认, 推荐)
#   cpuinfo=@device   不伪造; 现读真实 cpuinfo, 只把型号名/核数替换成华为的
#   cpuinfo=@none     不处理 /proc/cpuinfo
#   cpuinfo=@/sdcard/xxx.txt   使用任意路径的文件
cpuinfo=@file

# ---------------------------------------------------------------------------
# 三、/proc/meminfo 伪装 (只改 MemTotal, 其余保持真实)
# ---------------------------------------------------------------------------
# 16GB 机型可用内存约 15.3~15.6GB。留空则不处理 meminfo。
meminfo_memtotal_kb=15872000

# ---------------------------------------------------------------------------
# 四、uname / 内核标识伪装 (默认关闭)
# ---------------------------------------------------------------------------
# 开启后 uname().release 会变成华为内核版本号。
# 注意: 如果真实内核与伪装值差异过大, 部分反作弊可能反而因此起疑, 默认不开。
spoof_uname=0
uname_sysname=Linux
uname_nodename=localhost
uname_release=5.10.209-android13-8-g2f7c1b9a1c5e-ab12345678
uname_version=#1 SMP PREEMPT Thu Nov 20 10:23:41 CST 2025
uname_machine=aarch64
uname_domain=

# ---------------------------------------------------------------------------
# 五、其它伪装开关
# ---------------------------------------------------------------------------
# 拦截 __system_property_find (少数 App 用它拿属性句柄)。默认开。
hook_property_find=1
# 拦截 getprop 等走 shell 的读取(fork 出来的子进程, 尽力而为)。默认开。
hook_exec_getprop=1
# 伪装 /sys/devices/system/cpu/* 的核数与频率文件。默认开。
patch_sys_cpu=1
# 在 logcat 里输出调试日志 (tag: HW80Pro)。调好后建议设 0。
debug=0

# ===========================================================================
#  六、系统属性伪装表
#  说明: 带 "【需核对】" 的值是公开资料无法 100% 确认的字段(型号名 / 编译号 /
#  指纹 / 安全补丁), 建议用真机 `getprop` 输出核对后修改。
#  机型默认档: SGT-AL50 (国行 Mate 80 Pro, 16GB+512GB, 麒麟 9030 Pro)
# ===========================================================================

